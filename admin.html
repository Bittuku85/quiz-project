<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --bg-primary: #F8FAFC;
            --bg-secondary: #E2E8F0;
            --bg-dark: #1E293B;
            --text-dark: #1E293B;
            --text-light: #64748B;
            --accent-blue: #2563EB;
            --accent-gold: #FBBF24;
            --accent-red: #DC2626;
            --accent-green: #10B981;
            --border: #CBD5E1;
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Russo One', sans-serif;
            background: var(--bg-primary);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .admin-app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-dark);
            color: white;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar.mobile-hidden {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid #374151;
            text-align: center;
        }

        .sidebar-logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .sidebar-nav {
            padding: 1rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: none;
            color: white;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--accent-blue);
            color: white;
        }

        .nav-item i {
            margin-right: 1rem;
            width: 20px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            background: var(--bg-primary);
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }

        .main-content.sidebar-hidden {
            margin-left: 0;
        }

        .top-bar {
            background: white;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-dark);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .notification-badge {
            position: relative;
            cursor: pointer;
        }

        .notification-badge .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-red);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Content Pages */
        .content-page {
            display: none;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        .content-page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dashboard Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-2px);
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .metric-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .metric-icon.blue { background: var(--accent-blue); }
        .metric-icon.gold { background: var(--accent-gold); }
        .metric-icon.green { background: var(--accent-green); }
        .metric-icon.red { background: var(--accent-red); }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .metric-label {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .metric-change {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .metric-change.positive { color: var(--accent-green); }
        .metric-change.negative { color: var(--accent-red); }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .quick-action-btn {
            background: white;
            border: 2px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            color: var(--text-dark);
            text-decoration: none;
        }

        .quick-action-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(37, 99, 235, 0.05);
        }

        .quick-action-btn i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--accent-blue);
        }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .chart-header {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        /* Data Tables */
        .data-table {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .table-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .table-actions {
            display: flex;
            gap: 1rem;
        }

        .search-input {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .add-button {
            background: var(--accent-blue);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg-secondary);
            font-weight: bold;
            color: var(--text-dark);
        }

        tr:hover {
            background: rgba(37, 99, 235, 0.05);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-live { background: var(--accent-red); color: white; }
        .status-upcoming { background: var(--accent-gold); color: var(--text-dark); }
        .status-past { background: var(--bg-secondary); color: var(--text-dark); }
        .status-pending { background: #F59E0B; color: white; }
        .status-approved { background: var(--accent-green); color: white; }
        .status-rejected { background: var(--accent-red); color: white; }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.25rem 0.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-edit { background: #3B82F6; color: white; }
        .btn-delete { background: var(--accent-red); color: white; }
        .btn-approve { background: var(--accent-green); color: white; }
        .btn-reject { background: var(--accent-red); color: white; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .close-button {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-button {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-button:hover {
            background: #1E40AF;
        }

        .submit-button:disabled {
            background: var(--bg-secondary);
            color: var(--text-light);
            cursor: not-allowed;
        }

        /* Alert Messages */
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .alert-error {
            background: rgba(220, 38, 38, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(220, 38, 38, 0.3);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #F59E0B;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main-content {
                margin-left: 0;
            }

            .menu-toggle {
                display: block;
            }

            .top-bar {
                padding: 1rem;
            }

            .content-page {
                padding: 1rem;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .table-actions {
                justify-content: space-between;
            }
        }

        /* Loading Spinner */
        .loading-spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Payment Request Styles */
        .payment-request {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .payment-request:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .payment-info h4 {
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .payment-info p {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .payment-amount {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .payment-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .upi-info {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .upi-info p {
            margin-bottom: 0.5rem;
        }

        .upi-info strong {
            color: var(--accent-blue);
        }
    </style>
</head>

        const mockPaymentRequests = [
            {

            },
            {

                status: "pending",

            },
            {

                amount: 750,
                transactionId: "TXN456789123",
                status: "approved",
                requestedAt: "2024-12-19T16:20",

                upiId: "Bittukr@fam"
            }
        ];

        const AdminApp = () => {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [showModal, setShowModal] = React.useState(null);
            const [sidebarOpen, setSidebarOpen] = React.useState(true);
            const [tournaments, setTournaments] = React.useState(mockTournaments);
            const [players, setPlayers] = React.useState(mockPlayers);
            const [paymentRequests, setPaymentRequests] = React.useState(mockPaymentRequests);
            const [loading, setLoading] = React.useState(false);
            const [message, setMessage] = React.useState(null);
            const [searchTerm, setSearchTerm] = React.useState('');

            // Dashboard metrics
            const metrics = {
                totalTournaments: tournaments.length,
                totalPlayers: players.length,
                onlinePlayers: Math.floor(Math.random() * 50) + 20,
                walletBalance: players.reduce((sum, player) => sum + player.walletBalance, 0),
                pendingPayments: paymentRequests.filter(p => p.status === 'pending').length,
                totalRevenue: tournaments.reduce((sum, t) => sum + (t.entryFee * t.playersJoined), 0)
            };

            // Tournament management
            const handleCreateTournament = async (formData) => {
                setLoading(true);
                try {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    const newTournament = {
                        id: Date.now(),
                        ...formData,
                        playersJoined: 0,
                        status: 'upcoming',
                        createdAt: new Date().toISOString()
                    };
                    
                    setTournaments(prev => [...prev, newTournament]);
                    setMessage({ type: 'success', text: 'Tournament created successfully!' });
                    setShowModal(null);
                } catch (error) {
                    setMessage({ type: 'error', text: 'Failed to create tournament.' });
                } finally {
                    setLoading(false);
                }
            };

            const handleEditTournament = async (id, formData) => {
                setLoading(true);
                try {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    setTournaments(prev => prev.map(t => 
                        t.id === id ? { ...t, ...formData } : t
                    ));
                    
                    setMessage({ type: 'success', text: 'Tournament updated successfully!' });
                    setShowModal(null);
                } catch (error) {
                    setMessage({ type: 'error', text: 'Failed to update tournament.' });
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteTournament = async (id) => {
                if (confirm('Are you sure you want to delete this tournament?')) {
                    setTournaments(prev => prev.filter(t => t.id !== id));
                    setMessage({ type: 'success', text: 'Tournament deleted successfully!' });
                }
            };

            // Payment management
            const handlePaymentAction = async (id, action) => {
                setLoading(true);
                try {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    setPaymentRequests(prev => prev.map(p => 
                        p.id === id 
                            ? { 
                                ...p, 
                                status: action,
                                [action + 'At']: new Date().toISOString()
                              }
                            : p
                    ));

                    if (action === 'approved') {
                        const payment = paymentRequests.find(p => p.id === id);
                        setPlayers(prev => prev.map(player => 
                            player.id === payment.userId
                                ? { ...player, walletBalance: player.walletBalance + payment.amount }
                                : player
                        ));
                    }
                    
                    setMessage({ 
                        type: 'success', 
                        text: `Payment ${action} successfully!` 
                    });
                } catch (error) {

                                            >
                                                <option value="">Select Map</option>
                                                <option value="Bermuda">Bermuda</option>
                                                <option value="Purgatory">Purgatory</option>
                                                <option value="Kalahari">Kalahari</option>
                                                <option value="Alpine">Alpine</option>
                                            </select>
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Date & Time</label>
                                            <input 
                                                className="form-input" 
                                                type="datetime-local" 
                                                name="datetime" 
                                                defaultValue={tournament.datetime || ''}
                                                required 
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Max Players</label>
                                            <input 
                                                className="form-input" 
                                                type="number" 
                                                name="maxPlayers" 
                                                defaultValue={tournament.maxPlayers || ''}
                                                min="10" 
                                                max="100" 
                                                required 
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Entry Fee (₹)</label>
                                            <input 
                                                className="form-input" 
                                                type="number" 
                                                name="entryFee" 
                                                defaultValue={tournament.entryFee || ''}
                                                min="10" 
                                                required 
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Prize Pool (₹)</label>
                                            <input 
                                                className="form-input" 
                                                type="number" 
                                                name="prize" 
                                                defaultValue={tournament.prize || ''}
                                                min="100" 
                                                required 
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Room ID</label>
                                            <input 
                                                className="form-input" 
                                                type="text" 
                                                name="roomId" 
                                                defaultValue={tournament.roomId || ''}
                                                required 
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Room Password</label>
                                            <input 
                                                className="form-input" 
                                                type="text" 
                                                name="roomPass" 
                                                defaultValue={tournament.roomPass || ''}
                                                required 
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        className="submit-button"
                                        disabled={loading}
                                    >
                                        {loading ? (
                                            <>
                                                <div className="loading-spinner"></div>
                                                {isEdit ? 'Updating...' : 'Creating...'}
                                            </>
                                        ) : (
                                            isEdit ? 'Update Tournament' : 'Create Tournament'
                                        )}
                                    </button>
                                </form>
                            </div>
                        </div>
                    );
                }

                return null;
            };

            // Initialize charts when components mount
            React.useEffect(() => {
                if (activeTab === 'dashboard') {
                    // Initialize dashboard charts
                    setTimeout(() => {
                        const signupsCanvas = document.getElementById('signupsChart');
                        const revenueCanvas = document.getElementById('revenueChart');
                        
                        if (signupsCanvas && window.Chart) {
                            new Chart(signupsCanvas, {
                                type: 'line',
                                data: {
                                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                                    datasets: [{
                                        label: 'Sign-ups',
                                        data: [12, 19, 8, 15, 22, 18, 25],
                                        borderColor: '#2563EB',
                                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                                        tension: 0.4
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    plugins: { legend: { display: false } }
                                }
                            });
                        }
                        
                        if (revenueCanvas && window.Chart) {
                            new Chart(revenueCanvas, {
                                type: 'doughnut',
                                data: {
                                    labels: ['Entry Fees', 'Top-ups', 'Referrals'],
                                    datasets: [{
                                        data: [60, 30, 10],
                                        backgroundColor: ['#2563EB', '#FBBF24', '#10B981']
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    plugins: { legend: { position: 'bottom' } }
                                }
                            });
                        }
                    }, 100);
                }
            }, [activeTab]);

            return (
                <div className="admin-app">
                    {message && (
                        <div className={`alert alert-${message.type}`} style={{
                            position: 'fixed',
                            top: '20px',
                            right: '20px',
                            zIndex: 3000,
                            minWidth: '300px'
                        }}>
                            <i className={`fas fa-${message.type === 'success' ? 'check-circle' : 'exclamation-triangle'}`}></i>
                            {message.text}
                        </div>
                    )}

                    <Sidebar />
                    
                    <div className={`main-content ${!sidebarOpen ? 'sidebar-hidden' : ''}`}>
                        <TopBar />
                        
                        {activeTab === 'dashboard' && <DashboardPage />}
                        {activeTab === 'tournaments' && <TournamentsPage />}
                        {activeTab === 'players' && <PlayersPage />}
                        {activeTab === 'payments' && <PaymentsPage />}
                        {activeTab === 'analytics' && <AnalyticsPage />}
                        {activeTab === 'settings' && <SettingsPage />}
                    </div>

                    <Modal />
                </div>
            );
        };

        ReactDOM.render(<AdminApp />, document.getElementById('admin-app'));
    </script>
</body>
</html>
